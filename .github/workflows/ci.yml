name: wanxiang-ci

# AGENTS.md §24 CI 分级：
#   每个 PR：build + unit + contract + compatibility-current + format/lint
#   merge 到 main 后：integration + recovery + crash-matrix
# 本 workflow：PR 与 main 均运行 PR 级门禁；main 额外运行集成/恢复/崩溃矩阵。

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 定期分级（§24）：large-history + soak 每周跑一次（不进 PR gate）
    - cron: "0 4 * * 0"

jobs:
  pr-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # 不用 setup-dotnet 的 cache（它要求 packages.lock.json）；按项目文件哈希缓存 NuGet 包。
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.fsproj', '**/*.csproj', '**/Directory.*.props', '**/Directory.*.targets', 'NuGet.config', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install wasm-tools workload (Wanxiang.Pwa 为 browser-wasm)
        run: dotnet workload install wasm-tools --skip-manifest-update || dotnet workload install wasm-tools

      - name: Restore
        run: dotnet restore wanxiang.slnx

      - name: Build (Release, warnings-as-errors)
        run: dotnet build wanxiang.slnx -c Release --no-restore --verbosity minimal

      - name: Format gate (dotnet format --verify-no-changes)
        run: dotnet format wanxiang.slnx --verify-no-changes --verbosity minimal

      - name: UI trait gate (漏打或多打都退出码非 0)
        run: python3 tools/tag_ui_tests.py --check

      - name: Unit + contract + compatibility (non-UI)
        run: ./run-tests.sh --no-ui

      - name: UI tests (process-level parallel)
        # 8 个测试进程各自起主机：改用轮询文件监视，免得撞上 runner 的 inotify 实例上限。
        env:
          DOTNET_USE_POLLING_FILE_WATCHER: "1"
        run: ./run-tests.sh --ui-only -j 8

  main-gate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: pr-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # 不用 setup-dotnet 的 cache（它要求 packages.lock.json）；按项目文件哈希缓存 NuGet 包。
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.fsproj', '**/*.csproj', '**/Directory.*.props', '**/Directory.*.targets', 'NuGet.config', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install wasm-tools workload (Wanxiang.Pwa 为 browser-wasm)
        run: dotnet workload install wasm-tools --skip-manifest-update || dotnet workload install wasm-tools

      - name: Build (Release)
        run: dotnet build wanxiang.slnx -c Release --verbosity minimal

      - name: Integration + recovery + crash matrix (non-UI)
        run: ./run-tests.sh --no-ui

  large-history-gate:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # 不用 setup-dotnet 的 cache（它要求 packages.lock.json）；按项目文件哈希缓存 NuGet 包。
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.fsproj', '**/*.csproj', '**/Directory.*.props', '**/Directory.*.targets', 'NuGet.config', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install wasm-tools workload (Wanxiang.Pwa 为 browser-wasm)
        run: dotnet workload install wasm-tools --skip-manifest-update || dotnet workload install wasm-tools

      - name: Build (Release)
        run: dotnet build wanxiang.slnx -c Release --verbosity minimal

      - name: Large-history perf + soak (10^5/10^6 commits, 3x300 ops)
        run: ./run-tests.sh --no-ui --large-history
