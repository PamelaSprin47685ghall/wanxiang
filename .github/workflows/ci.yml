name: wanxiang-ci

# AGENTS.md §24 CI 分级：
#   每个 PR：build + unit + contract + compatibility-current + format/lint
#   merge 到 main 后：integration + recovery + crash-matrix
# 本 workflow：PR 与 main 均运行 PR 级门禁；main 额外运行集成/恢复/崩溃矩阵。

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 定期分级（§24）：large-history + soak 每周跑一次；另见决策 301（PR 碰历史/渲染、push main 也跑）
    - cron: "0 4 * * 0"

jobs:
  pr-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # 不用 setup-dotnet 的 cache（它要求 packages.lock.json）；按项目文件哈希缓存 NuGet 包。
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.fsproj', '**/*.csproj', '**/Directory.*.props', '**/Directory.*.targets', 'NuGet.config', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install wasm-tools workload (Wanxiang.Pwa 为 browser-wasm)
        run: dotnet workload install wasm-tools --skip-manifest-update || dotnet workload install wasm-tools

      - name: Restore
        run: dotnet restore wanxiang.slnx

      - name: Build (Release, warnings-as-errors)
        run: dotnet build wanxiang.slnx -c Release --no-restore --verbosity minimal

      - name: Build output carries current avalonia.js patch (决策 403)
        run: python3 tools/verify_avalonia_patch.py src/Wanxiang.Pwa/bin/Release/net10.0-browser/browser-wasm/AppBundle src/Wanxiang.App/bin/Release/net10.0/pwa

      - name: Publish PWA + desktop App and assert patched avalonia.js (决策 403)
        run: |
          dotnet publish src/Wanxiang.Pwa/Wanxiang.Pwa.fsproj -c Release --verbosity minimal
          python3 tools/verify_avalonia_patch.py src/Wanxiang.Pwa/bin/Release/net10.0-browser/browser-wasm/AppBundle
          dotnet publish src/Wanxiang.App/Wanxiang.App.fsproj -c Release -o "$RUNNER_TEMP/wanxiang-publish" --verbosity minimal
          python3 tools/verify_avalonia_patch.py "$RUNNER_TEMP/wanxiang-publish/pwa"

      # 决策 411：对发布产物（不是 bin/ 开发构建）起主机 --pwa（随机空闲端口），headless Chrome DPR 2
      # 验证渲染、画布像素比与文本上屏桥。
      - name: Smoke-test published App + PWA (headless Chrome)
        run: |
          npm ci --no-audit --no-fund
          SMOKE_OUT="$RUNNER_TEMP/smoke" tools/smoke_published.sh "$RUNNER_TEMP/wanxiang-publish"

      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore

      - name: Format gate (dotnet format --verify-no-changes)
        run: dotnet format wanxiang.slnx --verify-no-changes --verbosity minimal

      - name: UI trait gate (漏打或多打都退出码非 0)
        run: python3 tools/tag_ui_tests.py --check

      - name: Unit + contract + compatibility (non-UI)
        run: ./run-tests.sh --no-ui

      - name: UI tests (process-level parallel)
        # 8 个测试进程各自起主机：改用轮询文件监视，免得撞上 runner 的 inotify 实例上限。
        env:
          DOTNET_USE_POLLING_FILE_WATCHER: "1"
        run: ./run-tests.sh --ui-only -j 8

  main-gate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: pr-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # 不用 setup-dotnet 的 cache（它要求 packages.lock.json）；按项目文件哈希缓存 NuGet 包。
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.fsproj', '**/*.csproj', '**/Directory.*.props', '**/Directory.*.targets', 'NuGet.config', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install wasm-tools workload (Wanxiang.Pwa 为 browser-wasm)
        run: dotnet workload install wasm-tools --skip-manifest-update || dotnet workload install wasm-tools

      - name: Build (Release)
        run: dotnet build wanxiang.slnx -c Release --verbosity minimal

      - name: Integration + recovery + crash matrix (non-UI)
        run: ./run-tests.sh --no-ui

  # 决策 301：large-history 不再只靠每周定时——碰了历史 / 渲染代码的 PR 与每次 push main 都跑，
  # 不会被静默跳过。路径判断用 git diff，不引第三方 action。
  history-changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      touched: ${{ steps.diff.outputs.touched }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          files=$(git diff --name-only "$base"...HEAD)
          echo "$files"
          if echo "$files" | grep -qE '^(src/Wanxiang\.(Store|Core|Protocol|Server)/|src/Wanxiang\.UI/(Views/(ChatView|MessageCard|Sidebar)\.fs|Rich/|Model/|AppShell\.fs)|tests/Wanxiang\.Tests/(PerformanceBaseline|Library|PerceivedPerf|WindowedNavigation)Tests\.fs|run-tests\.sh|\.github/workflows/)'; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
          else
            echo "touched=false" >> "$GITHUB_OUTPUT"
          fi

  large-history-gate:
    needs: [history-changes]
    if: >-
      always() &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' && needs.history-changes.outputs.touched == 'true'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # 不用 setup-dotnet 的 cache（它要求 packages.lock.json）；按项目文件哈希缓存 NuGet 包。
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.fsproj', '**/*.csproj', '**/Directory.*.props', '**/Directory.*.targets', 'NuGet.config', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install wasm-tools workload (Wanxiang.Pwa 为 browser-wasm)
        run: dotnet workload install wasm-tools --skip-manifest-update || dotnet workload install wasm-tools

      - name: Build (Release)
        run: dotnet build wanxiang.slnx -c Release --verbosity minimal

      - name: Large-history perf + soak (10^5/10^6 commits, 3x300 ops)
        run: ./run-tests.sh --no-ui --large-history
