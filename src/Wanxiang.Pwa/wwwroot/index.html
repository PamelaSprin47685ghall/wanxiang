<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="万象">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="format-detection" content="telephone=no">
    <meta name="theme-color" content="#1B365D" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#15151A" media="(prefers-color-scheme: dark)">
    <title>万象</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>html{background:#f5f4ed;color-scheme:light dark}</style>
    <link rel="stylesheet" href="./app.css" />
</head>

<body>
    <div id="out">
        <div class="splash" role="status" aria-live="polite" aria-busy="true" aria-label="万象正在启动">
            <img class="splash-logo" src="/logo.png" alt="万象" />
            <div class="splash-title">万象</div>
            <div class="splash-sub">正在启动…</div>
            <div class="splash-bar" aria-hidden="true"></div>
        </div>
    </div>
    <noscript><div class="shell-notice" role="alert">万象需要启用 JavaScript 才能运行。</div></noscript>
    <!-- 壳层状态条：离线 / 安装提示。位于 canvas 之外，不依赖 .NET 运行时是否已启动。 -->
    <div id="shell-status" class="shell-bar shell-offline" role="status" aria-live="polite" hidden>
        <span class="shell-dot" aria-hidden="true"></span>
        <span class="shell-text">网络已断开。已打开的页面可继续使用，网络恢复后会自动重连。</span>
    </div>
    <div id="shell-install" class="shell-bar shell-install" role="region" aria-label="安装万象" hidden>
        <span class="shell-text" id="shell-install-text">安装到主屏幕，像应用一样全屏打开。</span>
        <button type="button" class="shell-btn shell-btn-primary" id="shell-install-go">安装</button>
        <button type="button" class="shell-btn" id="shell-install-dismiss" aria-label="暂不安装">暂不</button>
    </div>
    <script type="module" src="./main.js"></script>
</body>

</html>
