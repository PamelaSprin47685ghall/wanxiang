<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#4D5C92" />
  <title>万象 · wanxiang</title>
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  
  <!-- CDN 库（Marked / Highlight.js / Lucide 图标） -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.344.0/dist/umd/lucide.min.js"></script>

  <style>
    /* ================= 万象 · 设计令牌 =================
       灵感：Material You / 极简靛蓝 (Material 3 / Apple 细节融合) */
    :root {
      --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto,
              "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
              "Noto Sans CJK SC", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

      --bg: #f6f6f9;
      --panel: #ffffff;
      --sidebar: #efeff5;
      --border: #e3e3ec;
      --text: #1a1b21;
      --muted: #61626c;
      --faint: #8b8c98;

      --primary: #4d5c92;
      --on-primary: #ffffff;
      --primary-container: #dce1ff;
      --on-primary-container: #1a2a63;
      --secondary-container: #dee1f9;
      --on-secondary-container: #161b2c;
      --tool-chip: #e8eaf6;

      --user-bubble: #4d5c92;
      --user-text: #ffffff;
      --assistant-bubble: #ffffff;
      --assistant-border: #e3e3ec;

      --shadow-sm: 0 1px 3px rgba(26, 27, 33, .05), 0 2px 8px rgba(26, 27, 33, .04);
      --shadow-md: 0 4px 14px rgba(26, 27, 33, .07), 0 12px 28px rgba(26, 27, 33, .09);
      --shadow-lg: 0 8px 24px rgba(26, 27, 33, .09), 0 24px 48px rgba(26, 27, 33, .12);
      --focus-ring: 0 0 0 3px rgba(77, 92, 146, .26);

      --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-pill: 999px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121213;
        --panel: #1b1b20;
        --sidebar: #16161a;
        --border: #2c2c35;
        --text: #f0f0f5;
        --muted: #b0b0bc;
        --faint: #7e7e8a;

        --primary: #b6c4ff;
        --on-primary: #1d2d61;
        --primary-container: #354479;
        --on-primary-container: #dce1ff;
        --secondary-container: #424659;
        --on-secondary-container: #dee1f9;
        --tool-chip: #2a2c3a;

        --user-bubble: #b6c4ff;
        --user-text: #1d2d61;
        --assistant-bubble: #1f1f26;
        --assistant-border: #2c2c35;

        --shadow-sm: 0 1px 3px rgba(0, 0, 0, .3), 0 2px 8px rgba(0, 0, 0, .25);
        --shadow-md: 0 4px 14px rgba(0, 0, 0, .35), 0 12px 30px rgba(0, 0, 0, .4);
        --shadow-lg: 0 8px 24px rgba(0, 0, 0, .45), 0 24px 48px rgba(0, 0, 0, .55);
        --focus-ring: 0 0 0 3px rgba(182, 196, 255, .28);
      }
    }

    [hidden] { display: none !important; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      display: flex;
      overflow: hidden;
      font-size: 14px;
      letter-spacing: -0.005em;
      -webkit-font-smoothing: antialiased;
    }
    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-thumb {
      background: rgba(128, 128, 140, .3); border-radius: 999px;
      border: 2px solid transparent; background-clip: padding-box;
    }
    ::-webkit-scrollbar-thumb:hover { background: rgba(128, 128, 140, .5); background-clip: padding-box; border: 2px solid transparent; }
    ::-webkit-scrollbar-track { background: transparent; }
    * { scrollbar-width: thin; scrollbar-color: rgba(128, 128, 140, .3) transparent; }
    button, textarea, input { font-family: inherit; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible {
      outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 6px;
    }
    .muted { color: var(--muted); font-size: 13px; }

    /* ================= 按钮与控件 (精准对齐 & 统一高度) ================= */
    .btn {
      border: none; cursor: pointer; border-radius: var(--r-sm);
      height: 38px; padding: 0 16px; font-size: 13.5px; font-weight: 600; line-height: 1;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      white-space: nowrap; vertical-align: middle;
      transition: background .15s ease, transform .08s ease, box-shadow .15s ease, filter .15s ease;
    }
    .btn svg, .btn i[data-lucide] {
      flex: none; width: 15px; height: 15px; display: inline-block; vertical-align: middle;
    }
    .btn:active { transform: scale(.97); }
    .btn.primary { background: var(--primary); color: var(--on-primary); }
    .btn.primary:hover { filter: brightness(1.07); box-shadow: var(--shadow-sm); }
    .btn.primary:disabled { background: var(--border); color: var(--faint); box-shadow: none; cursor: default; }
    .btn.tonal { background: var(--secondary-container); color: var(--on-secondary-container); }
    .btn.tonal:hover { filter: brightness(.96); }
    .btn.small { height: 32px; padding: 0 12px; font-size: 12.5px; font-weight: 500; border-radius: 9px; }
    .btn.small svg, .btn.small i[data-lucide] { width: 13.5px; height: 13.5px; }

    .icon-btn {
      width: 34px; height: 34px; border-radius: 50%; border: none; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      color: var(--on-secondary-container); background: var(--secondary-container);
      transition: background .15s ease, transform .08s ease, filter .15s ease;
      flex: none; vertical-align: middle;
    }
    .icon-btn svg, .icon-btn i[data-lucide] { width: 16px; height: 16px; flex: none; }
    .icon-btn:hover { filter: brightness(.95); }
    .icon-btn:active { transform: scale(.93); }

    /* 新会话按钮：是主操作，不是装饰——一个可被读出名字的真实按钮 */
    .new-conv-btn {
      display: inline-flex; align-items: center; gap: 5px; height: 30px;
      padding: 0 12px; border-radius: 8px; border: none; cursor: pointer;
      background: var(--primary); color: var(--on-primary); font-size: 12.5px; font-weight: 600;
      transition: filter .15s ease, transform .08s ease; flex: none;
    }
    .new-conv-btn svg, .new-conv-btn i[data-lucide] { width: 14px; height: 14px; }
    .new-conv-btn:hover { filter: brightness(1.07); }
    .new-conv-btn:active { transform: scale(.97); }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .field span { font-size: 12px; color: var(--muted); font-weight: 500; }
    input, textarea {
      font: inherit; color: var(--text);
      padding: 10px 12px; border-radius: 12px;
      border: 1px solid var(--border); background: var(--panel);
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    input:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: var(--focus-ring); }

    /* ================= 登录 (Logo 尺寸微调 68px) ================= */
    #login {
      display: none; margin: auto; width: 400px; max-width: 94vw;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: var(--r-lg); padding: 36px 32px 30px;
      flex-direction: column; gap: 16px; box-shadow: var(--shadow-md);
    }
    #login.visible { display: flex; }
    .brand { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 4px; }
    .brand-tile {
      width: 68px; height: 68px; border-radius: 20px; flex: none;
      background: transparent; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      user-select: none;
    }
    .brand-tile img { width: 100%; height: 100%; object-fit: contain; }
    .brand-tile.small { width: 32px; height: 32px; border-radius: 50%; padding: 1px; }
    .brand-tile.large { width: 72px; height: 72px; border-radius: 22px; }
    #login h1 { font-size: 22px; margin: 0; letter-spacing: .5px; font-weight: 700; }
    .tagline { margin: 0; font-size: 13px; color: var(--muted); }
    
    .login-actions { display: flex; flex-direction: column; gap: 10px; width: 100%; margin-top: 4px; }
    .login-actions .btn { width: 100%; height: 40px; }

    .pair-box { display: none; flex-direction: column; gap: 10px; padding: 14px; background: var(--sidebar); border-radius: var(--r-md); animation: rise .2s ease-out; }
    .pair-box.visible { display: flex; }
    #login-status { min-height: 18px; text-align: center; }

    /* ================= 侧栏（无硬分割，靠底色分区） ================= */
    #main { display: none; flex: 1; min-width: 0; }
    #main.visible { display: flex; }
    #sidebar {
      width: 264px; flex: none;
      display: flex; flex-direction: column; background: var(--sidebar);
    }
    
    /* 顶栏 56px，无边框 */
    #sidebar header {
      height: 56px; padding: 0 14px; display: flex; align-items: center; gap: 10px; flex: none;
    }
    .app-name { font-size: 16px; font-weight: 700; letter-spacing: .5px; line-height: 1; }
    .version-tag { display: none; } /* 噪音：不展示装饰性的版本号徽标，保留代码仓库作为权威来源 */
    
    .search-box { padding: 6px 12px 8px; position: relative; }
    .search-box input {
      width: 100%; font-size: 12.5px; padding: 8px 11px 8px 32px; border-radius: 999px;
      background: var(--panel); border: none; box-shadow: inset 0 0 0 1px transparent;
      transition: box-shadow .15s ease;
    }
    .search-box input:focus { box-shadow: var(--focus-ring); }
    .search-icon { position: absolute; left: 24px; top: 16px; color: var(--faint); pointer-events: none; }
    
    .list-label {
      padding: 10px 24px 6px; font-size: 11px; font-weight: 600; letter-spacing: .08em;
      color: var(--faint); text-transform: uppercase; user-select: none;
    }
    
    /* 底栏：仅一个连接点状指示——文字状态在主界面里无决策价值 */
    #sidebar footer {
      height: 40px; padding: 0 20px;
      display: flex; align-items: center; flex: none;
    }
    #status { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; transition: background .25s ease, box-shadow .25s ease; }
    .dot.on { background: #34a853; box-shadow: 0 0 0 3px rgba(52, 168, 83, .2); }

    /* ================= 会话列表 ================= */
    #conv-list { flex: 1; overflow-y: auto; padding: 4px 0 8px; }
    .list-empty { padding: 32px 16px; text-align: center; color: var(--faint); font-size: 13px; }
    .conv-item {
      position: relative; margin: 3px 10px; padding: 10px 14px; border-radius: 12px; cursor: pointer;
      display: flex; flex-direction: column; gap: 3px; user-select: none;
      transition: background .12s ease, transform .12s ease;
    }
    .conv-item::before {
      content: ""; position: absolute; left: 0; top: 15%; bottom: 15%; width: 4px;
      border-radius: 0 4px 4px 0; background: var(--primary); opacity: 0;
      transition: opacity .15s ease, transform .15s ease; transform: scaleY(0.5);
    }
    .conv-item:hover { background: rgba(26, 27, 33, .05); transform: translateX(2px); }
    .conv-item:focus-visible { outline-offset: -2px; }
    .title-row { display: flex; align-items: center; gap: 4px; min-width: 0; }
    .conv-item .title { flex: 1; font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .conv-item .meta { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; min-width: 0; }
    .conv-item .meta .preview { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* …菜单按钮：默认零视觉负担，悬停/聚焦才出现 */
    .conv-menu-btn {
      flex: none; width: 22px; height: 22px; border-radius: 6px; border: none; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent; color: var(--faint); opacity: 0;
      transition: opacity .12s ease, background .12s ease, color .12s ease;
    }
    .conv-menu-btn svg, .conv-menu-btn i[data-lucide] { width: 14px; height: 14px; }
    .conv-item:hover .conv-menu-btn, .conv-menu-btn:focus-visible { opacity: 1; }
    .conv-menu-btn:hover { background: color-mix(in srgb, var(--text) 10%, transparent); color: var(--text); }
    .conv-menu {
      position: absolute; right: 10px; top: 38px; z-index: 20;
      display: flex; flex-direction: column; min-width: 96px;
      background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
      padding: 4px; box-shadow: var(--shadow-md); animation: rise .12s ease-out;
    }
    .conv-menu button {
      border: none; background: transparent; text-align: left; padding: 7px 10px; border-radius: 7px;
      font-size: 12.5px; color: var(--text); cursor: pointer;
    }
    .conv-menu button:hover { background: color-mix(in srgb, var(--text) 6%, transparent); }
    .conv-menu button.danger { color: #d64545; }
    .conv-menu button.danger:hover { background: color-mix(in srgb, #d64545 10%, transparent); }
    .title-edit {
      flex: 1; min-width: 0; font: inherit; font-size: 13.5px; font-weight: 600; color: var(--text);
      background: var(--panel); border: 1px solid var(--primary); border-radius: 6px;
      padding: 1px 6px; outline: none;
    }
    .badge {
      flex: none; font-size: 10.5px; font-weight: 600; padding: 1px 8px; border-radius: 999px;
      background: var(--secondary-container); color: var(--on-secondary-container);
    }
    .conv-item.active { background: var(--primary-container); }
    .conv-item.active::before { opacity: 1; transform: scaleY(1); }
    .conv-item.active .title { color: var(--on-primary-container); }
    .conv-item.active .meta { color: color-mix(in srgb, var(--on-primary-container) 72%, transparent); }
    .conv-item.active .badge { background: color-mix(in srgb, var(--on-primary-container) 14%, transparent); color: var(--on-primary-container); }
    @media (prefers-color-scheme: dark) {
      .conv-item:hover { background: rgba(255, 255, 255, .06); }
    }

    /* ================= 聊天区（居中阅读列，助手无边框正文） ================= */
    #chat { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
    
    /* 顶栏：透明、极细分隔 */
    #chat header {
      height: 56px; padding: 0 24px; display: flex; align-items: center; gap: 10px;
      background: var(--bg); flex: none;
      border-bottom: 1px solid color-mix(in srgb, var(--border) 45%, transparent);
    }
    .conv-title { font-weight: 700; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: .01em; }
    
    /* 幽灵小按钮（头部操作） */
    .btn.ghost { background: transparent; color: var(--muted); }
    .btn.ghost:hover { background: color-mix(in srgb, var(--text) 6%, transparent); color: var(--text); }
    
    .gen-status {
      display: none; align-items: center; gap: 7px;
      font-size: 12px; font-weight: 500; padding: 4px 6px 4px 12px; border-radius: 999px;
      background: var(--secondary-container); color: var(--on-secondary-container);
      flex: none; animation: rise .15s ease-out;
    }
    .gen-status.visible { display: inline-flex; }
    .gen-status .typing { display: inline-flex; gap: 3px; }
    .gen-status .typing i, .msg .typing i {
      width: 5px; height: 5px; border-radius: 50%; background: currentColor;
      animation: blink 1.2s infinite ease-in-out;
    }
    .gen-status .typing i:nth-child(2), .msg .typing i:nth-child(2) { animation-delay: .18s; }
    .gen-status .typing i:nth-child(3), .msg .typing i:nth-child(3) { animation-delay: .36s; }
    /* 取消生成：只在生成时跟随状态 chip 出现，不占用头部常驿位置 */
    .gen-cancel {
      width: 20px; height: 20px; border-radius: 50%; border: none; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent; color: inherit; opacity: .7;
      transition: background .12s ease, opacity .12s ease;
    }
    .gen-cancel:hover { background: rgba(0, 0, 0, .1); opacity: 1; }
    .gen-cancel svg, .gen-cancel i[data-lucide] { width: 12px; height: 12px; }
    @media (prefers-color-scheme: dark) { .gen-cancel:hover { background: rgba(255, 255, 255, .14); } }
    
    .header-spacer { flex: 1; }
    .header-actions { display: flex; align-items: center; gap: 8px; flex: none; }

    #messages { flex: 1; overflow-y: auto; padding: 28px 24px 20px; display: flex; flex-direction: column; gap: 28px; }
    #empty-state {
      position: absolute; inset: 56px 0 84px; display: none; pointer-events: none;
      flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      color: var(--muted); font-size: 13.5px; z-index: 1; padding: 24px; text-align: center;
    }
    #empty-state.visible { display: flex; }
    .empty-title { font-weight: 700; font-size: 16px; color: var(--text); margin: 4px 0 0; letter-spacing: .5px; }
    .empty-desc { margin: 0 0 14px; }
    
    /* 建议卡片网格 */
    .prompt-grid {
      pointer-events: auto;
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
      max-width: 660px; width: 100%; margin-top: 10px;
    }
    .empty-brand { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .empty-grid { margin-top: 18px; }
    /* “有会话但未选中”：不刷品牌脸，只给一个轻微提示 */
    .empty-title-secondary {
      font-size: 15px; color: var(--muted); font-weight: 500; letter-spacing: .01em; margin: 0 0 4px;
    }
    .prompt-card {
      background: var(--panel); border: none; border-radius: 16px;
      padding: 16px 18px; text-align: left; cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: transform .15s ease, box-shadow .15s ease;
      display: flex; flex-direction: column; gap: 5px;
    }
    .prompt-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    .prompt-card .card-title { font-size: 13.5px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 7px; }
    .prompt-card .card-desc { font-size: 12px; color: var(--muted); line-height: 1.45; }

    /* 消息行：居中阅读列（768px），用户行内容右对齐 */
    .msg-row {
      display: flex; gap: 0; align-items: flex-start;
      width: min(768px, 100%); margin: 0 auto;
    }
    .msg-row.user-row { flex-direction: row-reverse; }
    .msg-row.tool-row { justify-content: center; }
    .msg-row.assistant-row { padding-left: 0; }
    /* 头像已删：助手 vs. 用户的识别由“右对齐茄紫气泡 vs. 左对齐无边框正文”本身承担 */

    .msg-wrapper {
      position: relative; display: flex; flex-direction: column; flex: 1; min-width: 0;
    }

    .msg {
      padding: 12px 18px; border-radius: var(--r-md);
      word-break: break-word; line-height: 1.7; font-size: 14.5px;
      animation: rise .18s ease-out; width: 100%;
    }
    /* 用户气泡：唯一的“气泡”，收窄、柔和 */
    .msg.user {
      background: var(--user-bubble); color: var(--user-text);
      border: none; border-radius: 18px 18px 6px 18px;
      padding: 10px 16px; width: auto; max-width: 72%;
      box-shadow: 0 2px 8px color-mix(in srgb, var(--user-bubble) 28%, transparent);
    }
    .user-row .msg-wrapper { align-items: flex-end; }
    /* 助手：无边框正文，融入画布 */
    .msg.assistant {
      background: transparent; border: none; box-shadow: none;
      padding: 2px 0 0; border-radius: 0;
    }
    .msg.assistant.streaming { border: none; }
    .msg.tool {
      font-size: 12px; color: var(--muted);
      background: var(--tool-chip); border: none;
      padding: 6px 16px; border-radius: 999px; text-align: center;
      width: auto;
    }
    .msg .role { display: none; }
    .msg .typing { display: inline-flex; gap: 4px; padding: 6px 2px; color: var(--muted); }
    
    /* 悬停操作按钮：常驿在正常文档流中，仅悬停时可见，永不遮遮文字 */
    .msg-actions {
      display: flex; align-items: center; gap: 4px; margin-top: 6px; height: 26px;
      opacity: 0; transition: opacity .12s ease; pointer-events: none;
    }
    .msg-wrapper:hover .msg-actions { opacity: 1; pointer-events: auto; }
    .tool-row .msg-actions { display: none; }
    .msg-action-btn {
      width: 26px; height: 26px; border-radius: 50%; border: none; background: transparent;
      color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background .12s, color .12s; flex: none;
    }
    .msg-action-btn svg, .msg-action-btn i[data-lucide] { width: 13.5px; height: 13.5px; }
    .msg-action-btn:hover { background: var(--secondary-container); color: var(--text); }

    /* 富文本 / Markdown 格式化 */
    .msg-content { width: 100%; }
    .msg-content p { margin: 0 0 8px; }
    .msg-content p:last-child { margin-bottom: 0; }
    .msg-content h1, .msg-content h2, .msg-content h3, .msg-content h4 {
      margin: 14px 0 6px; font-weight: 700; line-height: 1.35; letter-spacing: -0.01em;
    }
    .msg-content h1 { font-size: 18px; }
    .msg-content h2 { font-size: 16px; }
    .msg-content h3 { font-size: 14.5px; }
    .msg-content ul, .msg-content ol { margin: 4px 0 8px; padding-left: 20px; }
    .msg-content li { margin-bottom: 4px; }
    .msg-content blockquote {
      margin: 8px 0; padding: 6px 14px; border-left: 3px solid var(--primary);
      background: color-mix(in srgb, var(--primary) 8%, transparent); border-radius: 0 8px 8px 0;
      font-style: italic; color: var(--muted);
    }
    .msg-content code {
      font-family: var(--font-mono);
      font-size: 12.5px; padding: 2px 6px; border-radius: 6px;
      background: color-mix(in srgb, var(--primary) 12%, transparent);
    }
    .msg.user .msg-content code {
      background: rgba(255, 255, 255, .2); color: inherit;
    }
    
    /* Mac 风格代码块 */
    .code-block {
      margin: 12px 0; border-radius: 12px; overflow: hidden;
      background: #0d1117; color: #c9d1d9; font-size: 13px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 16px rgba(0, 0, 0, .25); text-align: left;
    }
    .code-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 7px 14px; background: #161b22; border-bottom: 1px solid #21262d;
      height: 32px;
    }
    .mac-dots {
      display: flex; align-items: center; gap: 6px; flex: none;
    }
    .mac-dot {
      width: 10px; height: 10px; border-radius: 50%; display: inline-block;
    }
    .mac-dot.red { background: #ff5f56; }
    .mac-dot.yellow { background: #ffbd2e; }
    .mac-dot.green { background: #27c93f; }
    .code-lang-tag {
      font-size: 11px; font-weight: 600; color: #8b949e; text-transform: lowercase;
      font-family: var(--font-mono); letter-spacing: 0.04em; margin-left: 8px; flex: 1;
    }
    .code-copy {
      background: transparent; border: none; color: #8b949e; cursor: pointer;
      height: 24px; padding: 0 8px; border-radius: 4px; transition: background .12s, color .12s;
      display: inline-flex; align-items: center; justify-content: center; gap: 4px;
      font-size: 11.5px; line-height: 1;
    }
    .code-copy svg, .code-copy i[data-lucide] { width: 13px; height: 13px; }
    .code-copy:hover { background: #21262d; color: #c9d1d9; }
    .code-block pre { margin: 0; padding: 14px 16px; overflow-x: auto; font-family: var(--font-mono); line-height: 1.5; }
    .code-block code.hljs { background: transparent; padding: 0; }

    /* 思考折叠：左侧竖线引用式 */
    .thinking-box {
      margin: 2px 0 10px; border: none; border-left: 2px solid color-mix(in srgb, var(--primary) 40%, transparent);
      border-radius: 0; background: transparent;
      padding: 2px 0 2px 14px; font-size: 13px;
    }
    .thinking-box summary {
      cursor: pointer; font-weight: 500; color: var(--faint); user-select: none; outline: none;
      font-size: 12.5px; letter-spacing: .02em;
      list-style: none; display: inline-flex; align-items: center; gap: 6px;
      transition: color .12s ease;
    }
    .thinking-box summary::-webkit-details-marker { display: none; }
    .thinking-box summary::before {
      content: "›"; font-size: 14px; line-height: 1; color: var(--faint);
      transform: rotate(0deg); transition: transform .15s ease, color .12s ease; display: inline-block;
    }
    .thinking-box[open] > summary::before { transform: rotate(90deg); }
    .thinking-box summary:hover { color: var(--muted); }
    .thinking-box summary:hover::before { color: var(--muted); }
    .thinking-content { margin-top: 6px; color: var(--muted); font-size: 13px; line-height: 1.65; }

    .attachment {
      display: inline-block; margin-top: 8px; font-size: 12.5px; color: var(--primary);
      text-decoration: none; cursor: pointer; font-weight: 500;
      padding: 4px 12px; border-radius: 999px; background: color-mix(in srgb, var(--primary) 10%, transparent);
      transition: background .12s ease;
    }
    .attachment:hover { background: color-mix(in srgb, var(--primary) 18%, transparent); }
    .msg.user .attachment { background: rgba(255, 255, 255, .16); color: inherit; }
    .msg.user .attachment:hover { background: rgba(255, 255, 255, .26); }
    .attachment.missing { color: var(--faint); cursor: default; background: transparent; }

    /* ================= 输入区（悬浮式作曲器，与阅读列同宽） ================= */
    #input-wrap {
      padding: 6px 24px 20px; flex: none; background: transparent;
      display: flex; flex-direction: column; align-items: center;
    }
    #input-bar {
      display: flex; align-items: center; gap: 8px; width: min(816px, 100%);
      background: var(--panel); border: 1px solid color-mix(in srgb, var(--border) 70%, transparent); border-radius: 26px;
      padding: 6px 8px 6px 16px;
      box-shadow: 0 2px 6px rgba(26, 27, 33, .04), 0 12px 32px rgba(26, 27, 33, .08);
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    #input-bar:focus-within {
      border-color: color-mix(in srgb, var(--primary) 45%, transparent);
      box-shadow: 0 2px 6px rgba(26, 27, 33, .04), 0 12px 36px rgba(77, 92, 146, .16);
    }
    #input {
      flex: 1; border: none; background: transparent; outline: none; padding: 6px 4px;
      font-size: 14.5px; box-shadow: none !important; resize: none; max-height: 120px;
      font-family: inherit; line-height: 1.45; margin: 0; align-self: center;
    }
    #input:disabled { color: var(--faint); }
    
    .send-btn {
      width: 36px; height: 36px; border-radius: 50%; border: none; cursor: pointer; flex: none;
      background: var(--primary); color: var(--on-primary);
      display: inline-flex; align-items: center; justify-content: center;
      transition: transform .08s ease, filter .15s ease, background .15s ease;
      align-self: center;
    }
    .send-btn:hover:not(:disabled) { filter: brightness(1.07); box-shadow: var(--shadow-sm); }
    .send-btn:active:not(:disabled) { transform: scale(.92); }
    /* 发送按钮：上下文化——空时以幽灵底色融入，输入了内容才点亮 */
    .send-btn { transition: background .15s ease, opacity .15s ease, transform .08s ease, box-shadow .15s ease, color .15s ease; }
    .send-btn:disabled, .send-btn.empty { background: transparent; color: var(--faint); cursor: default; box-shadow: none; }
    .send-btn:disabled:hover, .send-btn.empty:hover { filter: none; }
    .send-btn svg, .send-btn i[data-lucide] { width: 18px; height: 18px; }

    .chip {
      display: flex; align-items: center; gap: 8px; margin: 0 8px 8px;      padding: 5px 8px 5px 14px; background: var(--secondary-container);
      color: var(--on-secondary-container); border-radius: 999px; font-size: 12.5px;
      max-width: 70%; animation: rise .15s ease-out;
    }
    .chip[hidden] { display: none; }
    .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chip button { border: none; background: transparent; color: inherit; cursor: pointer; font-size: 16px; line-height: 1; padding: 0 4px; border-radius: 50%; }
    .chip button:hover { background: rgba(0, 0, 0, .08); }
    @media (prefers-color-scheme: dark) { .chip button:hover { background: rgba(255, 255, 255, .14); } }

    /* ================= 模态框 (按钮高度与间距统一) ================= */
    .modal {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(26, 27, 33, .38);
      display: flex; align-items: center; justify-content: center; padding: 20px;
      animation: fade-in .15s ease-out;
    }
    .modal[hidden] { display: none; }
    .modal-card {
      width: 440px; max-width: 94vw;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: var(--r-lg); padding: 24px; box-shadow: var(--shadow-lg);
      display: flex; flex-direction: column; gap: 16px;
      animation: rise .18s ease-out;
    }
    .modal-card h2 { margin: 0; font-size: 17px; font-weight: 700; }
    .modal-input {
      width: 100%; font: inherit; color: var(--text);
      padding: 10px 12px; border-radius: 12px;
      border: 1px solid var(--border); background: var(--panel);
      resize: vertical; line-height: 1.5;
    }
    .modal-input:focus { outline: none; border-color: var(--primary); box-shadow: var(--focus-ring); }
    textarea.modal-input { min-height: 120px; }
    .modal-actions { display: flex; justify-content: flex-end; align-items: center; gap: 10px; padding-top: 4px; }
    .modal-actions .btn { height: 38px; min-width: 80px; }
    
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

    /* ================= 提示 ================= */
    .toast {
      position: fixed; top: 70px; right: 24px; max-width: 360px;
      background: #2f2f37; color: #fff; padding: 10px 16px; border-radius: 10px;
      z-index: 100; font-size: 13px; box-shadow: var(--shadow-md);
      transform: translateX(8px); opacity: 0;
      animation: toast-in .22s ease-out forwards;
    }
    @media (prefers-color-scheme: dark) { .toast { background: #e7e7ee; color: #1a1b21; } }

    /* ================= 动效 ================= */
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes toast-in { to { opacity: 1; transform: translateX(0); } }
    @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div id="login">
    <div class="brand">
      <div class="brand-tile"><img src="/logo.png" alt="万象" /></div>
      <h1>万象</h1>
      <p class="tagline">连接你的服务器，开始对话</p>
    </div>
    <label class="field">
      <span>服务器地址</span>
      <input id="server-url" placeholder="wss://host/ws 或 ws://127.0.0.1:8765/ws" spellcheck="false" autocomplete="off" />
    </label>
    <label class="field">
      <span>访问令牌（首次使用可留空并请求配对）</span>
      <input id="server-token" placeholder="wanxiang_client_…" type="password" autocomplete="off" />
    </label>
    <div class="login-actions">
      <button id="btn-connect" class="btn primary">连接</button>
      <button id="btn-pair" class="btn tonal">首次使用：请求配对码</button>
    </div>
    <div id="pair-box" class="pair-box">
      <label class="field">
        <span>在服务器终端（stderr）查看 6 位配对码</span>
        <input id="pair-code" placeholder="000000" maxlength="6" inputmode="numeric" autocomplete="off" />
      </label>
      <button id="btn-pair-submit" class="btn tonal">提交配对码</button>
    </div>
    <div id="login-status" class="muted"></div>
  </div>

  <div id="main">
    <aside id="sidebar">
      <header>
        <div class="brand-tile small"><img src="/logo.png" alt="万象" /></div>
        <span class="app-name">万象</span>
        <span style="flex:1;"></span>
        <button id="btn-new" class="new-conv-btn" title="新建会话 ⌘N" aria-label="新建会话">
          <i data-lucide="plus"></i><span>新会话</span>
        </button>
      </header>
      <div class="search-box">
        <i data-lucide="search" class="search-icon" style="width:14px; height:14px;"></i>
        <input id="conv-search" placeholder="搜索会话…  ⌘K" autocomplete="off" />
      </div>
      <div class="list-label">会话</div>
      <div id="conv-list"></div>
      <footer>
        <span class="dot" id="conn-dot" title="连接状态"></span>
      </footer>
    </aside>
    <section id="chat">
      <header>
        <span id="conv-title" class="conv-title">选择一个会话</span>
        <span id="gen-status" class="gen-status">
          <span class="typing"><i></i><i></i><i></i></span><span class="gen-status-text"></span>
          <button id="btn-cancel" class="gen-cancel" title="取消生成" aria-label="取消生成"><i data-lucide="x"></i></button>
        </span>
        <span class="header-spacer"></span>
        <div class="header-actions"></div>
      </header>
      <div id="empty-state">
        <div class="empty-state-primary" id="empty-state-primary">
          <div class="empty-brand">
            <div class="brand-tile large"><img src="/logo.png" alt="万象" /></div>
            <p class="empty-title">万象 · 智能工作站</p>
          </div>
        </div>
        <div class="empty-state-secondary" id="empty-state-secondary" hidden>
          <p class="empty-title-secondary">选择会话或新建一个</p>
        </div>
        <p id="empty-desc" class="empty-desc">选择左侧会话或点击下方建议开始对话</p>
        <div id="prompt-grid" class="prompt-grid empty-grid">
          <div class="prompt-card" data-prompt="请用通俗易懂的语言解释量子计算的基本原理与关键概念">
            <div class="card-title"><i data-lucide="sparkles" style="width:15px; height:15px; color: var(--primary);"></i> 概念解析</div>
            <div class="card-desc">用通俗易懂的语言解释复杂技术概念</div>
          </div>
          <div class="prompt-card" data-prompt="请帮我审查以下代码，指出潜在性能瓶颈与安全风险并给出优化重构方案：\n\n```python\n# 粘贴你的代码\n```">
            <div class="card-title"><i data-lucide="code" style="width:15px; height:15px; color: var(--primary);"></i> 代码审查与重构</div>
            <div class="card-desc">查找性能瓶颈、逻辑缺陷并重构代码</div>
          </div>
          <div class="prompt-card" data-prompt="请帮我拟定一份关于全栈 Agent 架构的技术报告大纲，包含存储、协议与运行时模块">
            <div class="card-title"><i data-lucide="layout-template" style="width:15px; height:15px; color: var(--primary);"></i> 架构设计大纲</div>
            <div class="card-desc">设计模块化系统架构与接口契约</div>
          </div>
          <div class="prompt-card" data-prompt="针对独立开发者构建 AI 效率工具，提供 5 个最具商业价值与可行性的创新方案">
            <div class="card-title"><i data-lucide="lightbulb" style="width:15px; height:15px; color: var(--primary);"></i> 创意头脑风暴</div>
            <div class="card-desc">获取创新产品方向与商业价值推演</div>
          </div>
        </div>
      </div>
      <div id="messages"></div>
      <div id="input-wrap">
        <div id="attach-chip" class="chip" hidden>
          <span id="attach-chip-name"></span>
          <button id="attach-chip-remove" aria-label="移除附件">×</button>
        </div>
        <div id="input-bar">
          <input type="file" id="file-input" hidden />
          <button id="btn-attach" class="icon-btn" title="上传附件" aria-label="上传附件">
            <i data-lucide="paperclip"></i>
          </button>
          <textarea id="input" rows="1" placeholder="选择或新建一个会话…" disabled autocomplete="off"></textarea>
          <button id="btn-send" class="send-btn empty" disabled aria-label="发送">
            <i data-lucide="arrow-up"></i>
          </button>
        </div>
      </div>
    </section>
  </div>

  <div id="modal" class="modal" hidden role="dialog" aria-modal="true">
    <div class="modal-card">
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
      <div class="modal-actions">
        <button id="modal-cancel" class="btn tonal">取消</button>
        <button id="modal-ok" class="btn primary"></button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
